<style>
:root{--bg:#08080b;--panel:#121216;--panel2:#1a1a20;--text:#f7f7fa;--muted:#9696a3;--accent:#ffbf16;--line:rgba(255,255,255,.085);--glass:rgba(29,29,34,.74);--danger:#ff5e61;--safe:#55d686}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",system-ui,sans-serif;min-height:100%;overscroll-behavior:none}button,input,textarea,select{font:inherit}button{color:inherit}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}.app{min-height:100dvh;padding:18px 18px 105px;max-width:1080px;margin:auto}.top{position:sticky;top:0;z-index:20;padding:10px 0 14px;background:linear-gradient(var(--bg) 72%,transparent);backdrop-filter:blur(16px)}.brandrow{display:flex;align-items:center;gap:12px}.brand{font-size:28px;font-weight:800;letter-spacing:-.6px;flex:1}.top-actions{display:flex;gap:9px}.circle,.pill,.navbtn{border:1px solid var(--line);background:rgba(255,255,255,.075);backdrop-filter:blur(20px);box-shadow:inset 0 1px rgba(255,255,255,.07)}.circle{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:25px}.search{margin-top:13px;display:flex;align-items:center;gap:9px;padding:0 15px;height:44px;border-radius:22px;background:#15151a;border:1px solid var(--line)}.search input{width:100%;background:transparent;border:0;outline:0;color:var(--text);font-size:15px}.search input::placeholder{color:#797985}.seg{margin-top:14px;display:flex;gap:5px;padding:5px;border-radius:22px;width:max-content;background:rgba(255,255,255,.06);border:1px solid var(--line)}.seg button{border:0;background:transparent;color:var(--muted);font-weight:700;padding:8px 14px;border-radius:17px}.seg button.active{background:var(--accent);color:#171208}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stat{padding:15px;border-radius:22px;background:var(--panel);border:1px solid var(--line)}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{position:relative;min-height:285px;border-radius:28px;overflow:hidden;border:1px solid var(--line);background:var(--panel);box-shadow:0 18px 50px rgba(0,0,0,.25)}.hero{position:absolute;inset:0;background:#17171c center/cover no-repeat}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 18%,rgba(0,0,0,.25) 55%,rgba(5,5,7,.96) 100%)}.cardbody{position:absolute;left:0;right:0;bottom:0;padding:18px}.badge{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.45);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:5px 9px;font-size:11px;color:#efeff5}.card h3{margin:10px 0 3px;font-size:22px;line-height:1.05}.sub{color:#b7b7c0;font-size:13px}.empty{margin-top:70px;text-align:center;color:var(--muted)}.empty-icon{width:78px;height:78px;border-radius:25px;margin:0 auto 16px;display:grid;place-items:center;font-size:36px;background:rgba(255,191,22,.14);color:var(--accent);border:1px solid rgba(255,191,22,.18)}.primary{border:0;background:var(--accent);color:#1a1302;font-weight:800;border-radius:18px;padding:13px 20px}.bottom{position:fixed;z-index:25;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));width:min(560px,calc(100% - 28px));display:grid;grid-template-columns:repeat(3,1fr);padding:7px;border-radius:29px;background:rgba(20,20,25,.83);border:1px solid var(--line);backdrop-filter:blur(26px);box-shadow:0 14px 40px rgba(0,0,0,.38)}.navbtn{border:0;background:transparent;color:#8f8f99;border-radius:23px;padding:11px 6px;font-weight:700}.navbtn.active{background:#222228;color:white}.overlay{position:fixed;z-index:50;inset:0;background:rgba(0,0,0,.58);backdrop-filter:blur(13px);display:none;align-items:flex-end}.overlay.show{display:flex}.sheet{width:100%;max-height:94dvh;overflow:auto;background:#0d0d11;border-radius:30px 30px 0 0;border:1px solid var(--line);padding:12px 18px calc(28px + env(safe-area-inset-bottom));box-shadow:0 -20px 80px rgba(0,0,0,.55)}.grab{width:42px;height:5px;border-radius:5px;background:#55555e;margin:1px auto 15px}.sheethead{display:flex;align-items:center;gap:12px;position:sticky;top:-12px;padding:10px 0 12px;background:rgba(13,13,17,.94);backdrop-filter:blur(18px);z-index:2}.sheethead h2{margin:0;flex:1;font-size:22px}.ghost{border:0;background:rgba(255,255,255,.08);border-radius:17px;padding:9px 14px}.formcard{margin:12px 0;background:var(--panel);border:1px solid var(--line);border-radius:25px;overflow:hidden}.field{padding:14px 16px;border-bottom:1px solid var(--line)}.field:last-child{border-bottom:0}.label{font-size:12px;color:var(--muted);margin-bottom:7px;font-weight:650}.field input,.field textarea,.field select{width:100%;color:white;background:transparent;border:0;outline:0;font-size:17px;padding:0;resize:none}.field textarea{min-height:72px}.photoPick{height:180px;border-radius:24px;background:#15151a center/cover no-repeat;border:1px dashed #484852;display:grid;place-items:center;color:var(--muted);overflow:hidden}.photoPick.has{border-style:solid}.photoPick input{display:none}.detailHero{height:330px;border-radius:30px;background:#17171c center/cover no-repeat;position:relative;overflow:hidden}.detailHero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.93))}.detailTitle{position:absolute;z-index:1;left:20px;right:20px;bottom:18px}.detailTitle h1{font-size:30px;margin:0 0 4px}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.chip{font-size:12px;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.09);border:1px solid var(--line)}.timeline{margin-top:16px}.event{display:grid;grid-template-columns:18px 1fr;gap:12px}.rail{position:relative}.dot{width:12px;height:12px;border-radius:50%;background:var(--accent);margin-top:18px}.rail:after{content:"";position:absolute;top:30px;bottom:-8px;left:5px;width:2px;background:rgba(255,255,255,.1)}.event:last-child .rail:after{display:none}.eventbox{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:14px;margin-bottom:10px}.eventbox b{font-size:15px}.eventbox p{color:#c1c1ca;margin:6px 0 0;white-space:pre-wrap}.eventbox small{color:var(--muted)}.settingsCard{background:var(--panel);border:1px solid var(--line);border-radius:25px;padding:17px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.danger{color:var(--danger)}.hidden{display:none!important}.toast{position:fixed;z-index:99;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);opacity:0;background:#26262d;color:white;padding:10px 16px;border-radius:16px;border:1px solid var(--line);transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:620px){.grid{grid-template-columns:1fr}.summary{grid-template-columns:repeat(3,1fr)}.stat{padding:12px}.stat b{font-size:18px}.card{min-height:310px}}@media(min-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.sheet{max-width:720px;margin:auto;border-radius:30px 30px 0 0}.overlay{justify-content:center}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brandrow"><div class="brand">物历</div><div class="top-actions"><button class="circle" id="addBtn">＋</button></div></div>
    <div class="search"><span>⌕</span><input id="search" placeholder="搜索你的东西" autocomplete="off"/></div>
    <div class="seg"><button data-filter="active" class="active">物品</button><button data-filter="archive">归档</button></div>
  </div>
  <div class="summary"><div class="stat"><b id="countActive">0</b><span>正在陪你</span></div><div class="stat"><b id="countArchive">0</b><span>已经归档</span></div><div class="stat"><b id="countDays">0</b><span>最长陪伴 / 天</span></div></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty"><div class="empty-icon">◇</div><h2>从第一件东西开始</h2><p>给手机、球鞋、锅、耳机……<br/>留下一份真正属于你的履历。</p><button class="primary" id="emptyAdd">＋ 添加物品</button></div>
  <div id="settings" class="hidden">
    <div class="settingsCard"><h2 style="margin-top:0">数据</h2><div class="row"><span>储存方式</span><span style="color:var(--muted)">本机浏览器 · IndexedDB</span></div><div class="row"><button class="ghost" id="exportBtn">导出备份</button><button class="ghost" id="importBtn">导入备份</button><input id="importFile" type="file" accept="application/json" class="hidden"/></div><div class="row"><button class="ghost danger" id="clearBtn">清空所有数据</button></div></div>
    <div class="settingsCard"><h2 style="margin-top:0">关于</h2><p style="color:var(--muted);line-height:1.65">物历 Web 重置版 0.1。专门绕开 Swift Playground 在 iPadOS 27 上的文字输入问题。无账号、无订阅、无服务器。</p></div>
  </div>
</div>
<div class="bottom"><button class="navbtn active" data-tab="home">▣ 物品</button><button class="navbtn" data-tab="archive">▤ 归档</button><button class="navbtn" data-tab="settings">⚙ 设置</button></div>
<div class="overlay" id="editorOverlay"><div class="sheet"><div class="grab"></div><div class="sheethead"><button class="ghost" id="cancelEdit">取消</button><h2 id="editorTitle">添加物品</h2><button class="primary" id="saveItem">保存</button></div><label class="photoPick" id="photoPick"><span>＋ 选择照片</span><input id="photoInput" type="file" accept="image/*"/></label><div class="formcard"><div class="field"><div class="label">名称 *</div><input id="fName" placeholder="例如：iPhone 13 Pro Max" autocomplete="off"/></div><div class="field"><div class="label">品牌 / 型号</div><input id="fBrand" placeholder="例如：Apple / 512GB" autocomplete="off"/></div><div class="field"><div class="label">分类</div><select id="fCategory"><option>数码</option><option>厨具</option><option>球鞋</option><option>服饰</option><option>模型</option><option>家居</option><option>运动</option><option>工具</option><option>收藏</option><option>其他</option></select></div><div class="field"><div class="label">状态</div><select id="fStatus"><option value="active">使用中</option><option value="idle">闲置</option><option value="collection">收藏</option><option value="retired">退役</option><option value="sold">卖出</option><option value="gifted">送出</option><option value="lost">遗失</option></select></div></div><div class="formcard"><div class="field"><div class="label">购入日期</div><input id="fDate" type="date"/></div><div class="field"><div class="label">价格</div><input id="fPrice" inputmode="decimal" placeholder="可选，例如：696"/></div><div class="field"><div class="label">现在放在哪里</div><input id="fLocation" placeholder="例如：家里 / 对象家" autocomplete="off"/></div></div><div class="formcard"><div class="field"><div class="label">关于它</div><textarea id="fNote" placeholder="想写什么都可以。为什么买它、喜欢它哪里、有什么故事……"></textarea></div></div></div></div>
<div class="overlay" id="detailOverlay"><div class="sheet" id="detailSheet"><div class="grab"></div><div class="sheethead"><button class="ghost" id="closeDetail">关闭</button><h2>物品履历</h2><button class="ghost" id="editItem">编辑</button></div><div id="detailContent"></div></div></div>
<div class="overlay" id="eventOverlay"><div class="sheet"><div class="grab"></div><div class="sheethead"><button class="ghost" id="cancelEvent">取消</button><h2>添加记录</h2><button class="primary" id="saveEvent">保存</button></div><div class="formcard"><div class="field"><div class="label">这次记录 *</div><input id="eTitle" placeholder="例如：第一次穿去踢球" autocomplete="off"/></div><div class="field"><div class="label">日期</div><input id="eDate" type="date"/></div><div class="field"><div class="label">补充一句</div><textarea id="eNote" placeholder="当时发生了什么？"></textarea></div></div></div></div>
<div class="toast" id="toast"></div>
<script>
const DB_NAME='wuli_web_reset_01',STORE='items';let db=null,memoryStore=new Map(),items=[],filter='active',tab='home',editingId=null,currentId=null,pendingPhoto=null;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function openDB(){return new Promise((res)=>{try{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>res()}catch(e){res()}})}
function tx(mode='readonly'){return db?.transaction(STORE,mode).objectStore(STORE)}
function readAll(){if(!db)return Promise.resolve([...memoryStore.values()]);return new Promise((res,rej)=>{const r=tx().getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function putItem(x){if(!db){memoryStore.set(x.id,structuredClone(x));return Promise.resolve()}return new Promise((res,rej)=>{const r=tx('readwrite').put(x);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function deleteItem(id){if(!db){memoryStore.delete(id);return Promise.resolve()}return new Promise((res,rej)=>{const r=tx('readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function uuid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()}
const statusName={active:'使用中',idle:'闲置',collection:'收藏',retired:'退役',sold:'卖出',gifted:'送出',lost:'遗失'};const isArchived=s=>['retired','sold','gifted','lost'].includes(s);
function daysSince(d){if(!d)return 0;return Math.max(1,Math.floor((Date.now()-new Date(d+'T00:00:00'))/86400000)+1)}
function fmtDate(d){if(!d)return'';const x=new Date(d+'T00:00:00');return `${x.getFullYear()}.${String(x.getMonth()+1).padStart(2,'0')}.${String(x.getDate()).padStart(2,'0')}`}
function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1600)}
async function refresh(){items=await readAll();render()}
function render(){const q=$('#search').value.trim().toLowerCase();const active=items.filter(x=>!isArchived(x.status)),arch=items.filter(x=>isArchived(x.status));$('#countActive').textContent=active.length;$('#countArchive').textContent=arch.length;$('#countDays').textContent=Math.max(0,...items.map(x=>daysSince(x.purchaseDate)));if(tab==='settings'){ $('#settings').classList.remove('hidden');$('#grid').classList.add('hidden');$('#empty').classList.add('hidden');return}else{$('#settings').classList.add('hidden');$('#grid').classList.remove('hidden')}
filter=tab==='archive'?'archive':filter;let src=(filter==='archive'?arch:active).filter(x=>[x.name,x.brand,x.category,x.location,x.note].join(' ').toLowerCase().includes(q));src.sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));$('#grid').innerHTML=src.map(cardHTML).join('');$('#empty').classList.toggle('hidden',src.length>0);$$('.card').forEach(c=>c.onclick=()=>openDetail(c.dataset.id));}
function cardHTML(x){const bg=x.photo?`style="background-image:url('${x.photo}')"`:'';return `<article class="card" data-id="${x.id}"><div class="hero" ${bg}></div><div class="shade"></div><div class="cardbody"><span class="badge">${esc(x.category)} · ${statusName[x.status]}</span><h3>${esc(x.name)}</h3><div class="sub">${esc(x.brand||'')} ${x.purchaseDate?'· 已陪你 '+daysSince(x.purchaseDate)+' 天':''}</div></div></article>`}
function openEditor(id=null){editingId=id;pendingPhoto=null;let x=id?items.find(i=>i.id===id):null;$('#editorTitle').textContent=id?'编辑物品':'添加物品';$('#fName').value=x?.name||'';$('#fBrand').value=x?.brand||'';$('#fCategory').value=x?.category||'数码';$('#fStatus').value=x?.status||'active';$('#fDate').value=x?.purchaseDate||new Date().toISOString().slice(0,10);$('#fPrice').value=x?.price??'';$('#fLocation').value=x?.location||'';$('#fNote').value=x?.note||'';const p=$('#photoPick');p.style.backgroundImage=x?.photo?`url('${x.photo}')`:'';p.classList.toggle('has',!!x?.photo);p.querySelector('span').textContent=x?.photo?'更换照片':'＋ 选择照片';$('#editorOverlay').classList.add('show');setTimeout(()=>$('#fName').focus(),300)}
async function saveItem(){const name=$('#fName').value.trim();if(!name){toast('先写名称');$('#fName').focus();return}let old=editingId?items.find(i=>i.id===editingId):null;const x={id:old?.id||uuid(),name,brand:$('#fBrand').value.trim(),category:$('#fCategory').value,status:$('#fStatus').value,purchaseDate:$('#fDate').value,price:$('#fPrice').value?Number($('#fPrice').value):null,location:$('#fLocation').value.trim(),note:$('#fNote').value.trim(),photo:pendingPhoto||old?.photo||null,createdAt:old?.createdAt||new Date().toISOString(),events:old?.events||[]};await putItem(x);$('#editorOverlay').classList.remove('show');await refresh();toast(editingId?'已更新':'已经记下来了')}
function openDetail(id){currentId=id;const x=items.find(i=>i.id===id);if(!x)return;const bg=x.photo?`style="background-image:url('${x.photo}')"`:'';const events=[...(x.events||[])].sort((a,b)=>b.date.localeCompare(a.date));$('#detailContent').innerHTML=`<div class="detailHero" ${bg}><div class="detailTitle"><h1>${esc(x.name)}</h1><div>${esc(x.brand||'')}</div><div class="chips"><span class="chip">${esc(x.category)}</span><span class="chip">${statusName[x.status]}</span>${x.purchaseDate?`<span class="chip">陪伴 ${daysSince(x.purchaseDate)} 天</span>`:''}${x.price!=null?`<span class="chip">¥${x.price}</span>`:''}</div></div></div>${x.note?`<div class="settingsCard"><b>关于它</b><p style="color:#c7c7cf;line-height:1.65;white-space:pre-wrap">${esc(x.note)}</p></div>`:''}<div class="settingsCard"><div class="row"><span>购入</span><span>${fmtDate(x.purchaseDate)||'—'}</span></div><div class="row"><span>现在放在</span><span>${esc(x.location||'—')}</span></div></div><div style="display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px"><h2 style="margin:0">时间线</h2><button class="primary" id="addEventBtn">＋ 添加记录</button></div><div class="timeline">${events.length?events.map(e=>`<div class="event"><div class="rail"><div class="dot"></div></div><div class="eventbox"><small>${fmtDate(e.date)}</small><br/><b>${esc(e.title)}</b>${e.note?`<p>${esc(e.note)}</p>`:''}</div></div>`).join(''):'<p style="color:var(--muted)">还没有记录。第一条可以是“第一次使用”。</p>'}</div><button class="ghost danger" id="deleteItemBtn" style="width:100%;margin-top:18px">删除这件物品</button>`;$('#detailOverlay').classList.add('show');$('#addEventBtn').onclick=()=>openEvent();$('#deleteItemBtn').onclick=async()=>{if(confirm('确定删除这件物品和它的全部记录吗？')){await deleteItem(id);$('#detailOverlay').classList.remove('show');await refresh();toast('已删除')}}}
function openEvent(){const x=items.find(i=>i.id===currentId);if(!x)return;$('#eTitle').value='';$('#eDate').value=new Date().toISOString().slice(0,10);$('#eNote').value='';$('#eventOverlay').classList.add('show');setTimeout(()=>$('#eTitle').focus(),300)}
async function saveEvent(){const title=$('#eTitle').value.trim();if(!title){toast('先写这次发生了什么');return}const x=items.find(i=>i.id===currentId);x.events=x.events||[];x.events.push({id:uuid(),title,date:$('#eDate').value,note:$('#eNote').value.trim()});await putItem(x);$('#eventOverlay').classList.remove('show');await refresh();openDetail(currentId);toast('记录已加入时间线')}
function readPhoto(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const max=1600,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
$('#photoInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;pendingPhoto=await readPhoto(f);const p=$('#photoPick');p.style.backgroundImage=`url('${pendingPhoto}')`;p.classList.add('has');p.querySelector('span').textContent='更换照片'};
$('#addBtn').onclick=()=>openEditor();$('#emptyAdd').onclick=()=>openEditor();$('#cancelEdit').onclick=()=>$('#editorOverlay').classList.remove('show');$('#saveItem').onclick=saveItem;$('#closeDetail').onclick=()=>$('#detailOverlay').classList.remove('show');$('#editItem').onclick=()=>{const id=currentId;$('#detailOverlay').classList.remove('show');openEditor(id)};$('#cancelEvent').onclick=()=>$('#eventOverlay').classList.remove('show');$('#saveEvent').onclick=saveEvent;$('#search').oninput=render;
$$('.seg button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;tab=filter==='archive'?'archive':'home';$$('.seg button').forEach(x=>x.classList.toggle('active',x===b));syncNav();render()});
$$('.navbtn').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;filter=tab==='archive'?'archive':'active';syncNav();render()});function syncNav(){$$('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$$('.seg button').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter))}
$('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),items},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='物历备份-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());for(const x of j.items||[])await putItem(x);await refresh();toast('备份已导入')}catch{toast('备份文件不对')}};$('#clearBtn').onclick=async()=>{if(confirm('确定清空所有物品和时间线吗？')){for(const x of items)await deleteItem(x.id);await refresh();toast('已经清空')}};
[...document.querySelectorAll('.overlay')].forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('show')}));
(async()=>{await openDB();await refresh();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{})})();
</script>
